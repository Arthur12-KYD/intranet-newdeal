name: CI - Build Scan Push dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  IMAGE_TAG:  ${{ github.sha }}

jobs:

  build:
    name: "Job 1 - Build image Docker"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image Docker nginx alpine3.23
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:dev-latest
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  scan:
    name: "Job 2 - Scan securite Trivy"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Download image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Chargement image Docker
        run: docker load --input /tmp/image.tar

      - name: Installation Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Scan vulnerabilites HIGH CRITICAL
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --output trivy-vuln-report.txt \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cat trivy-vuln-report.txt

      - name: Scan secrets code source
        run: |
          trivy fs \
            --scanners secret \
            --exit-code 1 \
            --format table \
            .

      - name: Scan secrets image Docker
        run: |
          trivy image \
            --scanners secret \
            --exit-code 1 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload rapports securite
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: trivy-vuln-report.txt
          retention-days: 30

  push:
    name: "Job 3 - Push vers Docker Hub"
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Download image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Chargement image Docker
        run: docker load --input /tmp/image.tar

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image vers Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:dev-latest
